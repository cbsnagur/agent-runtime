max_steps = 8

# Everything in [provider] goes to the adapter named by `provider`; switch vendors here, not in code.
[provider]
provider = "anthropic"
model = "claude-opus-5-5"
input_usd_per_mtok = 4.0
output_usd_per_mtok = 20.0
effort = "medium"
fallbacks = "default"  # server-side retry on another model if a safety classifier declines
max_tokens = 16000
